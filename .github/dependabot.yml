version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Paused for the contest freeze (see docs/SECURITY_TRIAGE.md §9): 0 pauses version-update PRs
    # only. GitHub's Dependabot options reference confirms open-pull-requests-limit does not apply
    # to security updates, which keep their own separate fixed limit of 10 and are unaffected.
    open-pull-requests-limit: 0
    # Every ignore rule names a dependency AND lists version-update:* types. Rules scoped by
    # update-types apply to version updates only, so Dependabot security updates still open
    # PRs for these packages. Never add a bare `dependency-name` or `versions` rule here:
    # those also suppress security updates.
    ignore:
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@iwsdk/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # three is an npm alias (npm:super-three@0.181.0); both names are listed because it is
      # unverified which one Dependabot matches. three is 0.x, so each release (0.181 -> 0.182)
      # is a semver-minor bump and is held back too; @types/three must track the same release.
      - dependency-name: 'three'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'super-three'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/three'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Paused for the contest freeze; see the npm block above.
    open-pull-requests-limit: 0
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']
